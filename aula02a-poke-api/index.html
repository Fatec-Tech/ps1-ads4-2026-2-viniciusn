<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Pokédex</title>

    <!-- Bootstrap CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

</head>

<body>

    <!-- ==========================================
         CONTEÚDO PRINCIPAL
    =========================================== -->

    <div class="container py-5">

        <!-- Título -->

        <h1 class="text-center mb-4">
            Pokédex
        </h1>


        <!-- ==========================================
             PESQUISA
        =========================================== -->

        <div class="row justify-content-center mb-4">

            <div class="col-md-8">

                <div class="input-group">

                    <input
                        type="text"
                        id="searchInput"
                        class="form-control"
                        placeholder="Digite o nome ou número do Pokémon"
                    >

                    <button
                        class="btn btn-primary"
                        id="searchBtn"
                    >
                        Buscar
                    </button>

                </div>

            </div>

        </div>


        <!-- ==========================================
             LOADING
        =========================================== -->

        <div
            id="loading"
            class="text-center d-none mb-4"
        >

            <div
                class="spinner-border text-primary"
                role="status"
            >
                <span class="visually-hidden">
                    Carregando...
                </span>
            </div>

            <p class="mt-2">
                Carregando Pokémon...
            </p>

        </div>


        <!-- ==========================================
             GRID DOS POKÉMON
        =========================================== -->

        <div
            class="row row-cols-1 row-cols-sm-2 row-cols-md-3 row-cols-lg-4 g-4"
            id="pokemonGrid"
        >
        </div>

    </div>


    <!-- ==========================================
         MODAL DE DETALHES
    =========================================== -->

    <div
        class="modal fade"
        id="pokemonModal"
        tabindex="-1"
        aria-hidden="true"
    >

        <div class="modal-dialog modal-dialog-centered">

            <div class="modal-content">


                <!-- Cabeçalho do Modal -->

                <div class="modal-header">

                    <h5
                        class="modal-title text-capitalize"
                        id="pokemonModalTitle"
                    >
                        Detalhes
                    </h5>

                    <button
                        type="button"
                        class="btn-close"
                        data-bs-dismiss="modal"
                        aria-label="Close"
                    ></button>

                </div>


                <!-- Corpo do Modal -->

                <div
                    class="modal-body"
                    id="pokemonModalBody"
                >
                </div>


            </div>

        </div>

    </div>


    <!-- ==========================================
         JAVASCRIPT DO BOOTSTRAP
    =========================================== -->

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    ></script>


    <!-- ==========================================
         JAVASCRIPT DA APLICAÇÃO
    =========================================== -->

    <script src="js/app.js"></script>

</body>

</html>
```
